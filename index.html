<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零的读法大闯关 · 千万以内</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
        }

        .game {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            padding: 26px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* ========== 顶部状态栏 ========== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            padding: 10px 22px;
            border-radius: 22px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .score-box .icon { font-size: 1.6rem; }

        .score-box .num {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
        }

        .level-box {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            padding: 10px 22px;
            border-radius: 22px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        /* ========== 题目区 ========== */
        .question-area {
            background: #f5f3ff;
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .question-label {
            font-size: 1.2rem;
            font-weight: 800;
            color: #6d28d9;
            margin-bottom: 14px;
        }

        /* ========== 数位展示区（8位：千万~个） ========== */
        .digit-cards {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 8px 0;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 4px;
        }

        .digit-card {
            flex: 0 0 auto;
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        /* 数位名称——大字号 */
        .digit-unit {
            font-size: 1rem;
            font-weight: 800;
            color: #1e293b;
            white-space: nowrap;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            border: 2px solid #e2e8f0;
        }

        /* 数字卡片——统一白色 */
        .digit-num {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 900;
            border-radius: 12px;
            border: 3px solid #cbd5e1;
            background: #ffffff;
            color: #1e293b;
            transition: all 0.2s;
        }

        .digit-num.empty {
            background: transparent;
            border: none;
        }

        /* 答案揭晓后：读出来的零——红色 */
        .digit-num.zero-read {
            background: #fee2e2;
            border-color: #ef4444;
            color: #dc2626;
            animation: bounce 0.5s ease;
        }

        /* 答案揭晓后：不读的零——灰色虚线 */
        .digit-num.zero-silent {
            background: #f8fafc;
            border: 3px dashed #cbd5e1;
            color: #94a3b8;
        }

        /* 答案揭晓后：非零数字——蓝色 */
        .digit-num.nonzero {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e40af;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* 数级分组标签 */
        .group-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .group-tag {
            flex: 0 0 auto;
            width: 80px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 800;
            padding: 4px 0;
            border-radius: 6px;
        }

        .group-tag.lv2 { background: #dcfce7; color: #166534; }
        .group-tag.lv1 { background: #ffedd5; color: #9a3412; }

        /* ========== 读法展示 ========== */
        .reading-box {
            background: linear-gradient(135deg, #4c1d95, #6d28d9);
            border-radius: 16px;
            padding: 16px 20px;
            text-align: center;
            margin: 14px 0;
            box-shadow: 0 6px 16px rgba(76, 29, 149, 0.3);
            display: none;
        }

        .reading-box.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .reading-label {
            font-size: 0.9rem;
            color: #c4b5fd;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .reading-text {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            line-height: 1.4;
            word-break: break-all;
        }

        .reading-text .rzero {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
        }

        /* ========== 选项区 ========== */
        .options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }

        .option-btn {
            background: #ffffff;
            border: 3px solid #c4b5fd;
            border-radius: 16px;
            padding: 18px 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #4c1d95;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .option-btn:hover {
            background: #ede9fe;
            border-color: #8b5cf6;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.2);
        }

        .option-btn.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            animation: pop 0.4s ease;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
            animation: shake 0.4s ease;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ========== 反馈区 ========== */
        .feedback {
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            line-height: 1.6;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .feedback.correct {
            background: #dcfce7;
            border: 3px solid #22c55e;
            color: #15803d;
        }

        .feedback.wrong {
            background: #fef3c7;
            border: 3px solid #f59e0b;
            color: #92400e;
        }

        .feedback.neutral {
            background: #f1f5f9;
            border: 3px solid #e2e8f0;
            color: #475569;
        }

        .feedback .hl {
            background: #fef08a;
            color: #854d0e;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 1.15rem;
        }

        /* ========== 底部按钮 ========== */
        .bottom-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 12px 26px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            color: #ffffff;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .btn-green { background: linear-gradient(135deg, #4ade80, #22c55e); }
        .btn-orange { background: linear-gradient(135deg, #fb923c, #f97316); }

        /* ========== 结束弹窗 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .overlay.show { display: flex; }

        .result-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 38px;
            text-align: center;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-emoji { font-size: 4rem; margin-bottom: 10px; }
        .result-title { font-size: 1.8rem; font-weight: 900; color: #4c1d95; margin-bottom: 10px; }
        .result-score { font-size: 1.2rem; font-weight: 700; color: #6d28d9; margin-bottom: 8px; }
        .result-star { font-size: 1.6rem; margin-bottom: 16px; }
        .result-tip { font-size: 1rem; color: #64748b; margin-bottom: 20px; line-height: 1.6; }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .game { padding: 16px; }
            .digit-card { width: 60px; }
            .digit-num { width: 52px; height: 52px; font-size: 1.6rem; }
            .digit-unit { font-size: 0.8rem; padding: 2px 4px; }
            .group-tag { width: 60px; font-size: 0.7rem; }
            .reading-text { font-size: 1.5rem; }
            .options { grid-template-columns: repeat(2, 1fr); }
            .option-btn { padding: 14px 8px; font-size: 1rem; }
            .btn { padding: 10px 18px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="game">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="score-box">
                <span class="icon">⭐</span>
                <span class="num" id="score">0</span>
            </div>
            <div class="level-box" id="levelBox">第 1 关 / 共 10 关</div>
        </div>

        <!-- 题目区 -->
        <div class="question-area">
            <div class="question-label">🎯 这个数要读几个零？</div>

            <!-- 数位卡片展示（最多8位：千万~个） -->
            <div class="digit-cards" id="digitCards"></div>
            <div class="group-tags" id="groupTags"></div>

            <!-- 读法展示（选答案后出现） -->
            <div class="reading-box" id="readingBox">
                <div class="reading-label">📢 读作</div>
                <div class="reading-text" id="readingText">零</div>
            </div>
        </div>

        <!-- 选项区 -->
        <div class="options" id="options">
            <button class="option-btn" data-answer="0">不读零</button>
            <button class="option-btn" data-answer="1">读 1 个零</button>
            <button class="option-btn" data-answer="2">读 2 个零</button>
            <button class="option-btn" data-answer="3">读 3 个零</button>
        </div>

        <!-- 反馈区 -->
        <div class="feedback neutral" id="feedback">
            👆 点击上面按钮，选择这个数要读几个零
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-bar">
            <button class="btn btn-orange" id="skipBtn">🎲 跳过这题</button>
            <button class="btn btn-green" id="nextBtn" disabled>➡️ 下一关</button>
            <button class="btn btn-purple" id="restartBtn">🔄 重新开始</button>
        </div>
    </div>

    <!-- 结束弹窗 -->
    <div class="overlay" id="overlay">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-title" id="resultTitle">闯关完成！</div>
            <div class="result-score" id="resultScore">得分：0 / 10</div>
            <div class="result-star" id="resultStar">⭐⭐⭐</div>
            <div class="result-tip" id="resultTip">你已经掌握了零的读法！</div>
            <button class="btn btn-green" id="playAgainBtn">🔄 再玩一次</button>
        </div>
    </div>

    <script>
        (function() {
            // ========== 中文数字和单位（8位：千万~个） ==========
            const cn = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            const units = ['', '十', '百', '千', '万', '十万', '百万', '千万'];
            const digitNames = ['个', '十', '百', '千', '万', '十万', '百万', '千万'];

            // ========== 随机出题生成器 ==========
            // 每次出题随机生成符合规则的数，保证覆盖多种零的分布
            function generateQuestion() {
                // 随机选一个数位长度（4~8位）
                const len = Math.floor(Math.random() * 5) + 4;

                // 随机生成数字字符串
                let str = '';
                // 最高位非零
                str += Math.floor(Math.random() * 9) + 1;

                for (let i = 1; i < len; i++) {
                    // 用不同概率控制零的分布
                    const r = Math.random();
                    if (r < 0.35) {
                        // 35% 概率出零
                        str += '0';
                    } else if (r < 0.5) {
                        // 15% 概率连续出零（再插入一个零）
                        str += '0';
                        if (Math.random() < 0.5 && i < len - 1) {
                            str += '0';
                            i++;
                        }
                    } else {
                        // 50% 概率非零
                        str += Math.floor(Math.random() * 9) + 1;
                    }
                }

                // 保证末尾不出零（末尾零不读，太简单，但偶尔也可以有）
                if (Math.random() < 0.8 && str.length > 1) {
                    // 80% 概率把末尾改成非零（避免全是末尾零的情况）
                    const lastChar = str[str.length - 1];
                    if (lastChar === '0') {
                        str = str.slice(0, -1) + (Math.floor(Math.random() * 9) + 1);
                    }
                }

                const num = parseInt(str, 10);

                // 计算正确读法和读几个零
                const result = toChinese(num);

                // 统计读出来的零的个数
                let readZeroCount = 0;
                for (let i = 0; i < result.text.length; i++) {
                    if (result.text[i] === '零') readZeroCount++;
                }

                return {
                    num: num,
                    reading: result.text,
                    answer: readZeroCount
                };
            }

            // ========== 数字转中文读法 ==========
            function toChinese(num) {
                if (num === 0) return { text: '零', readZeroPositions: [] };

                const str = num.toString();
                const len = str.length;
                let result = '';
                let zeroFlag = false;
                const readZeroPositions = [];

                for (let i = 0; i < len; i++) {
                    const d = parseInt(str[i]);
                    const pos = len - 1 - i;

                    if (d === 0) {
                        zeroFlag = true;
                    } else {
                        if (zeroFlag) {
                            result += '零';
                            readZeroPositions.push(pos + 1);
                            zeroFlag = false;
                        }
                        result += cn[d] + units[pos];
                    }
                }

                result = result.replace(/^一十/, '十');
                return { text: result, readZeroPositions };
            }

            // ========== 状态 ==========
            let currentQ = null;
            let score = 0;
            let questionIndex = 0;
            const totalQuestions = 10;
            let usedNumbers = []; // 避免重复出题

            // ========== DOM ==========
            const scoreEl = document.getElementById('score');
            const levelBox = document.getElementById('levelBox');
            const digitCards = document.getElementById('digitCards');
            const groupTags = document.getElementById('groupTags');
            const readingBox = document.getElementById('readingBox');
            const readingText = document.getElementById('readingText');
            const optionsEl = document.getElementById('options');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const skipBtn = document.getElementById('skipBtn');
            const restartBtn = document.getElementById('restartBtn');
            const overlay = document.getElementById('overlay');
            const resultEmoji = document.getElementById('resultEmoji');
            const resultTitle = document.getElementById('resultTitle');
            const resultScore = document.getElementById('resultScore');
            const resultStar = document.getElementById('resultStar');
            const resultTip = document.getElementById('resultTip');
            const playAgainBtn = document.getElementById('playAgainBtn');

            // ========== 渲染数位卡片 ==========
            function renderDigits(num, revealAnswer = false) {
                digitCards.innerHTML = '';
                groupTags.innerHTML = '';

                const str = num.toString();
                const { readZeroPositions } = toChinese(num);
                // 补全到8位（千万~个）
                const padded = str.padStart(8, ' ');

                for (let i = 0; i < 8; i++) {
                    const pos = 7 - i;
                    const ch = padded[i];

                    const card = document.createElement('div');
                    card.className = 'digit-card';

                    const unitEl = document.createElement('div');
                    unitEl.className = 'digit-unit';
                    unitEl.textContent = digitNames[pos];

                    const numEl = document.createElement('div');
                    numEl.className = 'digit-num';

                    if (ch === ' ') {
                        numEl.classList.add('empty');
                    } else {
                        numEl.textContent = ch;

                        if (revealAnswer) {
                            const d = parseInt(ch);
                            if (d !== 0) {
                                numEl.classList.add('nonzero');
                            } else {
                                if (readZeroPositions.includes(pos)) {
                                    numEl.classList.add('zero-read');
                                } else {
                                    numEl.classList.add('zero-silent');
                                }
                            }
                        }
                    }

                    card.appendChild(unitEl);
                    card.appendChild(numEl);
                    digitCards.appendChild(card);
                }

                // 数级分组标签（万级4位 + 个级4位）
                const groups = [
                    { name: '万级', cls: 'lv2', span: 4 },
                    { name: '个级', cls: 'lv1', span: 4 }
                ];
                groups.forEach(g => {
                    for (let i = 0; i < g.span; i++) {
                        const tag = document.createElement('div');
                        tag.className = 'group-tag ' + g.cls;
                        tag.textContent = i === 0 ? g.name : '';
                        groupTags.appendChild(tag);
                    }
                });
            }

            // ========== 渲染读法 ==========
            function renderReading(num) {
                const { text } = toChinese(num);
                let html = '';
                for (let i = 0; i < text.length; i++) {
                    if (text[i] === '零') {
                        html += '<span class="rzero">零</span>';
                    } else {
                        html += text[i];
                    }
                }
                readingText.innerHTML = html || '零';
            }

            // ========== 出题 ==========
            function newQuestion() {
                // 生成新题目，避免重复
                let q;
                let attempts = 0;
                do {
                    q = generateQuestion();
                    attempts++;
                } while (usedNumbers.includes(q.num) && attempts < 50);

                usedNumbers.push(q.num);
                if (usedNumbers.length > 30) usedNumbers.shift();

                currentQ = q;

                // 渲染数位（不揭晓答案）
                renderDigits(currentQ.num, false);

                // 隐藏读法区
                readingBox.classList.remove('show');
                readingText.innerHTML = '';

                // 重置选项
                optionsEl.querySelectorAll('.option-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('correct', 'wrong');
                });

                // 反馈
                feedback.className = 'feedback neutral';
                feedback.innerHTML = '👆 点击上面按钮，选择这个数要读几个零';

                nextBtn.disabled = true;
                levelBox.textContent = `第 ${questionIndex + 1} 关 / 共 ${totalQuestions} 关`;
            }

            // ========== 选择答案 ==========
            function selectAnswer(userAnswer) {
                if (!currentQ) return;
                const correctAnswer = currentQ.answer;

                // 揭晓答案
                renderDigits(currentQ.num, true);
                renderReading(currentQ.num);
                readingBox.classList.add('show');

                optionsEl.querySelectorAll('.option-btn').forEach(btn => {
                    btn.disabled = true;
                    const ans = parseInt(btn.dataset.answer);
                    if (ans === correctAnswer) btn.classList.add('correct');
                    else if (ans === userAnswer) btn.classList.add('wrong');
                });

                if (userAnswer === correctAnswer) {
                    score++;
                    scoreEl.textContent = score;
                    feedback.className = 'feedback correct';
                    feedback.innerHTML = `🎉 太棒了！读 <span class="hl">${correctAnswer} 个零</span>`;
                } else {
                    feedback.className = 'feedback wrong';
                    feedback.innerHTML = `😅 再想想～ 应该读 <span class="hl">${correctAnswer} 个零</span>`;
                }

                nextBtn.disabled = false;
            }

            // ========== 下一题 ==========
            function nextQuestion() {
                questionIndex++;
                if (questionIndex >= totalQuestions) {
                    showResult();
                    return;
                }
                newQuestion();
            }

            // ========== 显示结果 ==========
            function showResult() {
                overlay.classList.add('show');
                const rate = score / totalQuestions;

                if (rate >= 0.9) {
                    resultEmoji.textContent = '🏆';
                    resultTitle.textContent = '太厉害了！';
                    resultStar.textContent = '⭐⭐⭐';
                    resultTip.textContent = '你已经完全掌握了零的读法！';
                } else if (rate >= 0.7) {
                    resultEmoji.textContent = '🎉';
                    resultTitle.textContent = '闯关完成！';
                    resultStar.textContent = '⭐⭐';
                    resultTip.textContent = '再练一练，你会更棒！';
                } else if (rate >= 0.5) {
                    resultEmoji.textContent = '💪';
                    resultTitle.textContent = '继续加油！';
                    resultStar.textContent = '⭐';
                    resultTip.textContent = '记住：末尾零不读，中间连续零读一个。';
                } else {
                    resultEmoji.textContent = '📚';
                    resultTitle.textContent = '再试一次吧！';
                    resultStar.textContent = '✨';
                    resultTip.textContent = '多读几遍，慢慢就明白了。';
                }

                resultScore.textContent = `得分：${score} / ${totalQuestions}`;
            }

            // ========== 重新开始 ==========
            function restart() {
                score = 0;
                questionIndex = 0;
                usedNumbers = [];
                scoreEl.textContent = '0';
                overlay.classList.remove('show');
                newQuestion();
            }

            // ========== 跳过 ==========
            function skip() {
                if (questionIndex + 1 >= totalQuestions) {
                    showResult();
                    return;
                }
                questionIndex++;
                newQuestion();
            }

            // ========== 事件绑定 ==========
            optionsEl.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectAnswer(parseInt(btn.dataset.answer));
                });
            });

            nextBtn.addEventListener('click', nextQuestion);
            skipBtn.addEventListener('click', skip);
            restartBtn.addEventListener('click', restart);
            playAgainBtn.addEventListener('click', restart);

            // ========== 初始化 ==========
            function init() {
                score = 0;
                questionIndex = 0;
                usedNumbers = [];
                scoreEl.textContent = '0';
                newQuestion();
            }

            init();
        })();
    </script>
</body>
</html>
